<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
<link rel="stylesheet" href="style.css">

<title>Web Desconto</title> </head> <body>

<div class="calculator-card">

<h2>Web Desconto</h2>

<form id="calcForm">

<div class="form-group"> <label for="produto">Item :</label> <input type="text" id="produto" required placeholder="Digite o produto ou serviço" > </div>

<div class="form-group"> <label for="quantidade">Quantidade:</label> <input type="number" id="quantidade" min="1" required placeholder="Digite a quantidade" > </div>

<div class="form-group"> <label for="preco">Preço Unitário (R$):</label> <input type="number" id="preco" min="0" step="0.01" required placeholder="Digite o preço" > </div>

<button type="submit">Adicionar Item</button>

</form>

<div class="items-container"> <h3>Itens do Orçamento</h3>

<ul id="listaItens"></ul> </div>


<div class="result-container"> <p>Subtotal: R$ <span id="subtotal">0,00</span></p>

<p>Desconto: R$ <span id="valorDesconto">0,00</span></p>

<p class="total"> Total: R$ <span id="resultado">0,00</span> </p> </div>

</div>

<script src="main.js"></script>

</body> </html>
